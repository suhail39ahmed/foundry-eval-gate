name: eval-gate

on:
  push:
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run eval-gate on fixtures
        # Intentionally expects non-zero when bad fixtures fail checks.
        # For CI demo of the gate itself we run and upload reports even on failure.
        run: |
          set +e
          python -m eval_gate.cli --fixtures fixtures/traces --out reports
          code=$?
          echo "exit=$code"
          # Soft-pass the workflow so artifacts always upload; gate still exits non-zero locally.
          exit 0
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: eval-gate-report
          path: reports/
